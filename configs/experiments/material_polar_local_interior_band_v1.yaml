# 旧全局统计版本（用户已审查的第 1 批拟合）——仅作同协议参照，不混用
old_global_reference:
  fit_summary: analysis/runs/material_polar_residual_v1/manual_20261008T221522/fit/summary.json

training:
  device: cpu
  full_batch: true
  epochs: 200
  optimizer: adamw
  lr: 0.01
  weight_decay: 0.001
  aux_loss_weight: 0.01
  seed: 2026
  epoch0_candidate: true
  selection:
    primary: inner_val_macro_f1
    secondary: inner_val_accuracy
    tie_break: earlier_epoch
  refit_on_full_data: false

variants:
  R0: "P0 原样（对照）"
  RC: "P0 + C_local 修正（偏振槽输入置零；区域质量信息可用）"
  RCS: "P0 + C_local、S_local 修正（interior/band 两块实际偏振统计）"

shuffle_diagnostic:
  seeds: [2026, 2027, 2028, 2029, 2030]
  scope: "v2 修正：复合分箱 = original_bin*4 + interior_valid*2 + band_valid；同 split、同原 bin、同有效模式内无固定点双射（冻结种子）；完整标准化 S16 来自同一 donor；空块保持显式零；C/P0/缺失状态不变"
  correction_note: "v1 的行级双射+逐块守卫不能保证各区域内容仍是双射（两行可继承同一 donor 块而另一 donor 块弃用）；v2 改为复合分箱双射，覆盖率可能降低，按区域如实报告，未打乱样本不得作为偏振不敏感证据"
  interpretation: "打乱下降不得单独解释为材质因果贡献"

# 预先冻结的工程推进门槛（对本地变体；不是显著性检验）
acceptance_thresholds:
  1: "RCS_local 三折平均 Macro-F1 同时高于 R0 与 RC_local"
  2: "至少两折相对两种对照均不下降"
  3: "最差折相对任一对照 Macro-F1 下降不超过 1 个百分点"
  4: "合并外层预测相对两种对照均净改对（fixed > broke）"
  5: "各类合并召回相对任一对照下降不超过 1 个百分点"
  6: "至少两个采集组出现相对 R0 的净改对，并报告收益集中程度"
  attribution: "区域/灰度信息增益 = RC_local − R0；额外偏振增益 = RCS_local − RC_local；两者分列，不得混并"
  reference_note: "旧全局版本数字仅作参照；不同特征版本之间不设门槛、不择优"

guards:
  refuse_fit_without_explicit_mode: true
  refuse_existing_output_dir: true
  no_training_by_agent: "Agent 仅实现入口与测试；真实 fit 由用户手动执行"
