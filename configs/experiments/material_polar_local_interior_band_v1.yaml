# material_polar_local_interior_band_v1 — 局部偏振统计验证（方案 A，预注册）
#
# 方案选择（预先写入，未看任何外层结果后调整）：
#   从 2A 已有诊断中只选用方案 A"实例内部与边界分别统计"：
#   - interior = erode3x3_instance_mask_v1、band = instance_mask_minus_interior_v1
#     均为 2B/2A 批在任何残差结果之前冻结的定义，本批原样复用；
#   - 已有测量证据支持内/边界二分（band 有效率 0.582 vs interior 0.761，
#     mean|q| 0.126 vs 0.084，重 |q| 像素在 band 过代表 9.4% vs 4.3%）；
#   - 方案 B（未饱和亮区 vs 中等亮度）需要新设亮度阈值——不存在任何冻结
#     定义，且诊断显示饱和像素仅 ~1.5%、退化像素近零，B 的分区间几乎退化，
#     无预注册依据。故不实施 B，也不做任何特征组合搜索。
#
# 与被否决的 interior_erode3x3_fallback_original_v1 的区别：
#   本方案不改变区域可靠性规则——原测量区域 instance_mask & polar_valid
#   被"划分"为 interior/band 两块（不排除任何像素），s_valid 与全局定义
#   构造性相同；被否决的是"只用 interior 计算统计并回退"的可靠性规则。
#
# 冻结不变量（与 material_polar_residual_v1 完全一致）：
#   - 三折成员/角色、G、每折 P0（头+scaler）、训练预算、修正幅度、损失；
#   - 残差形式：delta = valid_s * 0.5 * tanh(W x)，W 零初始化无 bias；
#   - 唯一变化：残差输入从 14 维（C6+S8）变为 30 维（C14+S16），
#     S = interior 8 项 + band 8 项（同一 8 项统计定义，逐块计算）；
#     C = 原 6 项 + 每块 coverage/empty_flag/gray_mean/gray_std。
#   - 标准化：每折仅用 inner_train（C 全部行、S 按单元格有效性），
#     不再断言与冻结 P0 scaler 段相等（特征已不同，P0 本身不受影响，
#     其 logits 经冻结 scaler 与冻结头由全局缓存只读计算）。

experiment: material_polar_local_interior_band_v1

