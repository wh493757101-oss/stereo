# material_residual_scale_v1 — 训练侧残差幅度实验（第三批）
#
# 问题：在同一份修复版本输入（valid_weighted_legacy_support_v1）、相同
# 小型条件头与相同训练预算下，把残差幅度与冻结 P0 自身的分数尺度匹配
# （scaled: a_f = 0.5*s_f），是否比原 ±0.5 上界（fixed: a_f = 0.5）更有
# 效；新增收益是否超过质量控制信息本身的收益（scaled RCS vs scaled RC）？
#
# 固定不变：灰度 P0 及其 scaler/装配链（逐折身份校验，logits atol 1e-4）、
# C14/S16 定义（local_partition_interior_band_v1）、网络结构
# Linear(35,8)->SiLU->Linear(8,4,bias=False)（末层零初始化，epoch0 精确
# 等于 P0）、200 epoch CPU/full-batch AdamW lr=0.01 wd=0.001、
# CE+0.01*mean(delta²)、inner_val 选模（macro_f1 > accuracy > 更早
# epoch）、RC/RCS 同 s_valid 门控与缺失精确回退、打乱 v2 复合箱。
# 两臂唯一设计差异是 a_f；同折同种子所有训练路径共享初始化与 scaler。
#
# 本批只做工程验收（preflight/smoke/945帧修复特征重建/真实 dry-run）；
# 36 次真实拟合（2 臂 × RC/RCS × 3 折 × 3 种子）由用户手动执行。
# 离线组隔离实验；真实预测 mask 的完整系统验收属于后续批次。

