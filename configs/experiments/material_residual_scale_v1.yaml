p0_baseline_source:
  fit_dir: analysis/runs/material_existing_data_v1/manual_20261008_085510_822/fit
  verification: analysis/runs/material_existing_data_v1/20261008T140000Z_a9b8c7/baseline_v3/p0_baseline_verification.json

data:
  root: datasets/underwater_cls_fusion_v5_instance_mask
  source_root: datasets/underwater_seg_v2
  fingerprint: bb9e3661fb1e71e94056893f6dfc50b9e3dee1c604f430ac0727d75362d32982
  parent_v4_fingerprint: 8db8998d7a4c280064626961e4d51c92c531878ea2e92f0d1480df46379bd334
  class_names: [metal_submarine, plastic_submarine, plastic_fish, real_fish]
  dev_pool_splits: [train, val]
  excluded_splits: [test]

fix_inputs:
  # 本批特征重建唯一批准的上采样版本；正式默认仍为 legacy_zero_linear_v1
  upsample_version: valid_weighted_legacy_support_v1
  # 生产 matcher 参数（与冻结运行时配置逐项相等，准入时核对）
  matcher: sgbm
  mode: 3way
  max_disp: 768
  scale: 0.25
  block_size: 7
  uniqueness_ratio: 10
  speckle_window: 100
  speckle_range: 32
  texture_threshold: 10.0
  lr_check_threshold_px: 2.0
  min_valid_ratio: 0.05
  band_margin: 20
  full_image_threshold: 0.9
  crop_pad: 10

local_features:
  region_rule: local_partition_interior_band_v1
  feature_definition_version: existing_data_probe_v1_local_interior_band_v1
  definition_note: "C14/S16 统计定义不变；只换偏振输入来源（修复版重算）"

support_expectations:
  frames: 945
  instances: 2446
  groups: 21
  empty_frames: 4
  note: "开发池 = 原 train+val（21 组、945 帧、2446 实例、4 个无目标帧）；旧 test 不参与任何计算"

scale_rule:
  source: p0_logits_inner_train
  dtype: float64
  statistic: median
  margin: "m_i = largest(P0_logits_i) - second_largest(P0_logits_i)"
  min_scale: 1.0
  formula: "s_f = max(1.0, median(m_i))"
  shared_note: "同一折所有种子与变体共享 s_f；不读标签、不使用 inner_val/outer_eval"

arms:
  fixed:
    magnitude_factor: 0.5
    note: "a_f = 0.5（原冻结上界）"
  scaled:
    magnitude_factor: 0.5
    note: "a_f = 0.5 * s_f（与灰度分数尺度匹配）"
  formula_note: "delta = s_valid * a_f * tanh(head(x)); final = P0_logits + delta; P0 logits 不缩放"

variants:
  R0: "原样冻结 P0，真正的灰度基线，不训练；输出不依赖 C/S/polar_valid/缺失标记"
  RC: "C14＋原P0上下文；S16 在输入层精确置零。报告名称：灰度＋质量控制修正（含质量/有效性信息，不得称纯灰度）"
  RCS: "C14＋S16＋原P0上下文"
  gating: "RC/RCS 沿用相同 s_valid 门控；缺失偏振时 delta 精确为零，输出精确回退本折原 P0"

head:
  structure: "Linear(35,8) -> SiLU -> Linear(8,4,bias=False)"
  hidden: 8
  last_layer_zero_init: true
  shared_init_note: "同折同种子的两个幅度臂与 RC/RCS 使用相同初始化"

training:
  device: cpu
  full_batch: true
  epochs: 200
  optimizer: adamw
  lr: 0.01
  weight_decay: 0.001
  aux_loss_weight: 0.01
  note: "无增强、无类别加权、无额外调参；标准化只拟合修复缓存 inner_train（C 全行、S 有效单元格），同折四条训练路径共享同一 scaler；P0 用原冻结 scaler 与原装配链"

seeds: [2026, 2027, 2028]
planned_fits: 36

shuffle:
  content_seeds: [2026, 2027, 2028, 2029, 2030]
  binning:
    columns: [c_valid_ratio_0, c_gray_mean_3]
    source: "修复缓存 C14 的第 0 列（quality_valid_ratio）与第 3 列（gray_mean_in_instance_mask）"
    quantiles: [0.3333333333333333, 0.6666666666666666]
    edge_source: "仅本折 inner_train"
  composite_bin: "原箱*4 + interior有效*2 + band有效"
  donor_rules: "同协议角色、同复合箱、偏振可用；不放回、无固定点、不用自身；不跨折、不用旧test、不按GT类别"
  note: "完整标准化 S16 来自同一 donor；接收方 G/C/P0上下文/尺度/区域缺失模式/s_valid 不变；所有幅度臂与训练种子复用同内容种子的身份映射；单元素箱 unmatched 并保留原输入"

gates:
  note: "工程推进门槛（全部满足才建议后续实际mask验证），不是独立泛化或统计显著性标准"
  gate1: "scaled RCS 三折三种子平均 Macro-F1 相对 R0 ≥ +1.0pp，相对同臂 RC ≥ +0.5pp"
  gate2: "scaled RCS 相对同输入 fixed RCS 平均 Macro-F1 严格提高且成对累计净改对"
  gate3: "至少两个种子的 scaled RCS 相对 R0 与同臂 RC 均净改对"
  gate4: "至少两折的种子平均相对两种对照均不下降；最差折下降 ≤ 1.0pp"
  gate5: "任一类别 pooled 召回的种子均值相对两种对照下降不超过 1.0pp"
  gate6: "至少两个采集组相对 R0 净改对（并报告收益集中程度）"

tolerances:
  p0_logit_atol: 0.0001
  note: "既有 P0 logit atol=1e-4 不放宽"
